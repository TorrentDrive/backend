[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; Enables supervisorctl inside the container, so
;   docker exec torrentdrive supervisorctl status
; reports which of the nine processes are actually running. Without this there
; is no way to tell a crash-looping worker from a healthy one: the API answers
; its health check either way. Bound to a unix socket, so nothing is exposed
; outside the container.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgres
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres-error.log

[program:redis]
command=/usr/bin/redis-server --dir /data/redis --appendonly yes --bind 127.0.0.1 --protected-mode yes --port 6379
user=redis
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis-error.log

[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/data/prometheus --web.listen-address=0.0.0.0:47600
autostart=true
autorestart=true
priority=25
startsecs=5
stdout_logfile=/var/log/supervisor/prometheus.log
stderr_logfile=/var/log/supervisor/prometheus-error.log

[program:grafana]
command=/usr/share/grafana/bin/grafana server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini
autostart=true
autorestart=true
priority=25
startsecs=5
stdout_logfile=/var/log/supervisor/grafana.log
stderr_logfile=/var/log/supervisor/grafana-error.log
environment=GF_PATHS_DATA="/data/grafana",GF_PATHS_PROVISIONING="/etc/grafana/provisioning",GF_SERVER_HTTP_PORT="47500",GF_USERS_ALLOW_SIGN_UP="false"

[program:api]
command=/app/wait-for-db.sh /usr/bin/dotnet /app/api/TorrentDrive.API.dll
directory=/app/api
autostart=true
autorestart=true
priority=30
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=ASPNETCORE_URLS="http://+:47200"

[program:frontend]
command=/usr/bin/node /app/frontend/server.js
directory=/app/frontend
autostart=true
autorestart=true
priority=40
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="47100",HOSTNAME="0.0.0.0"

[program:torrent-worker]
command=/app/wait-for-db.sh /usr/bin/dotnet /app/torrent-worker/TorrentDrive.Worker.dll
directory=/app/torrent-worker
autostart=true
autorestart=true
priority=50
startretries=5
startsecs=10
stopwaitsecs=360
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gdrive-worker]
command=/app/wait-for-db.sh /usr/bin/dotnet /app/gdrive-worker/TorrentDrive.GoogleDrive.Worker.dll
directory=/app/gdrive-worker
autostart=true
autorestart=true
priority=50
startretries=5
startsecs=10
stopwaitsecs=360
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:s3-worker]
command=/app/wait-for-db.sh /usr/bin/dotnet /app/s3-worker/TorrentDrive.S3.Worker.dll
directory=/app/s3-worker
autostart=true
autorestart=true
priority=50
startretries=5
startsecs=10
stopwaitsecs=360
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
