name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types:
      - build-combined
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  compile:
    name: Compile
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      bump: ${{ steps.version.outputs.bump }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail

          props_version=$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' Directory.Build.props | head -n1 | tr -d '[:space:]')
          [ -z "$props_version" ] && props_version="2.1.0"

          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          tag_version="${latest_tag#v}"

          if [ -n "$tag_version" ]; then
            base_version=$(printf '%s\n%s\n' "$props_version" "$tag_version" | sort -V | tail -n1)
          else
            base_version="$props_version"
          fi

          IFS='.' read -r major minor patch <<< "$base_version"

          if [ -n "$latest_tag" ] && git merge-base --is-ancestor "$latest_tag" HEAD 2>/dev/null; then
            range="${latest_tag}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi

          head_subj=$(git log -1 --format="%s")
          changed_non_docs=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -vE '(\.md$|^docs/)' || true)

          should_release="true"
          if [ "${{ github.event_name }}" = "push" ]; then
            if echo "$head_subj" | grep -qE '^docs(\([^)]+\))?:' || [ -z "$changed_non_docs" ]; then
              should_release="false"
            fi
          fi

          dispatch_bump="${{ github.event.client_payload.bump }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "$dispatch_bump" ]; then
            case "$dispatch_bump" in
              major) major=$((major + 1)); minor=0; patch=0; bump="major" ;;
              minor) minor=$((minor + 1)); patch=0; bump="minor" ;;
              *)     patch=$((patch + 1)); bump="patch" ;;
            esac
          else
            commits_full=$(git log $range --format="%s%n%b" 2>/dev/null || git log -1 --format="%s%n%b")
            commits_subj=$(git log $range --format="%s" 2>/dev/null || git log -1 --format="%s")

            if echo "$commits_full" | grep -qE '(BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:)'; then
              major=$((major + 1))
              minor=0
              patch=0
              bump="major"
            elif echo "$commits_subj" | grep -qE '^feat(\([^)]+\))?:'; then
              minor=$((minor + 1))
              patch=0
              bump="minor"
            else
              patch=$((patch + 1))
              bump="patch"
            fi
          fi

          version="${major}.${minor}.${patch}"
          major_minor="${major}.${minor}"

          if [ "$should_release" = "true" ]; then
            sed -i "s|<Version>[^<]*</Version>|<Version>${version}</Version>|" Directory.Build.props
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${major_minor}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "Computed next version: ${version} (bump: ${bump}, should_release: ${should_release}, base: ${base_version}, latest tag: ${latest_tag:-none})"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore TorrentDrive.sln

      - name: Build
        run: dotnet build TorrentDrive.sln -c Release --no-restore

      - name: Export the configuration schema
        run: |
          set -euo pipefail
          dotnet TorrentDrive.API/bin/Release/net9.0/TorrentDrive.API.dll --dump-config-schema > config-schema.json
          entries=$(jq '.entries | length' config-schema.json)
          echo "Documented ${entries} configuration values."
          jq -e '.entries | length > 0' config-schema.json > /dev/null

      - name: Upload the configuration schema
        uses: actions/upload-artifact@v4
        with:
          name: config-schema
          path: config-schema.json
          if-no-files-found: error

  images:
    name: ${{ matrix.service.name }}
    needs: compile
    if: (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) && (github.event_name == 'pull_request' || needs.compile.outputs.should_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: .
            dockerfile: TorrentDrive.API/Dockerfile
          - name: worker
            context: .
            dockerfile: TorrentDrive.Worker/Dockerfile
          - name: gdrive-worker
            context: .
            dockerfile: TorrentDrive.GoogleDrive.Worker/Dockerfile
          - name: s3-worker
            context: .
            dockerfile: TorrentDrive.S3.Worker/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stamp release version into Directory.Build.props
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>${{ needs.compile.outputs.version }}</Version>|" Directory.Build.props

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.compile.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ needs.compile.outputs.major_minor }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TorrentDrive ${{ matrix.service.name }}
            org.opencontainers.image.description=TorrentDrive ${{ matrix.service.name }} — self-hosted torrent-to-cloud
            org.opencontainers.image.vendor=TorrentDrive
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://tc.gitnasr.com
            org.opencontainers.image.documentation=https://tc.gitnasr.com/docs

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          platforms: linux/amd64,linux/arm64

  smoke:
    name: Smoke test (all-in-one)
    needs: compile
    if: (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) && (github.event_name == 'pull_request' || needs.compile.outputs.should_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Stamp release version into Directory.Build.props
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>${{ needs.compile.outputs.version }}</Version>|" Directory.Build.props

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: TorrentDrive/frontend
          path: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 all-in-one image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: torrentdrive-smoke:test
          cache-from: type=gha,scope=combined-amd64
          cache-to: type=gha,mode=max,scope=combined-amd64
          platforms: linux/amd64

      - name: Smoke test - boot with no configuration at all
        run: bash .github/scripts/smoke-test.sh

  combined-image:
    name: All-in-One (${{ matrix.arch }})
    needs: [compile, smoke]
    if: (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) && (github.event_name == 'pull_request' || needs.compile.outputs.should_release == 'true')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Stamp release version into Directory.Build.props
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>${{ needs.compile.outputs.version }}</Version>|" Directory.Build.props

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: TorrentDrive/frontend
          path: frontend

      - name: Set image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/torrentdrive" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=combined-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=combined-${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release v${{ needs.compile.outputs.version }}
    needs: [compile, images, combined-image]
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) && needs.compile.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/torrentdrive" >> "$GITHUB_OUTPUT"

      - name: Generate CalVer tag
        id: calver
        run: |
          set -euo pipefail
          DATE_TAG=$(date +'%Y.%m.%d')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "full_tag=${DATE_TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the combined image manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          version="${{ needs.compile.outputs.version }}"
          major_minor="${{ needs.compile.outputs.major_minor }}"
          calver_tag="${{ steps.calver.outputs.full_tag }}"

          refs=""
          for digest in *; do
            refs="${refs} ${image}@sha256:${digest}"
          done
          echo "Merging:${refs}"

          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:${version}" \
            --tag "${image}:${major_minor}" \
            --tag "${image}:${calver_tag}" \
            ${refs}

          docker buildx imagetools inspect "${image}:latest"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download configuration schema artifact
        uses: actions/download-artifact@v4
        with:
          name: config-schema
          path: .

      - name: Bump version, tag, and create GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.compile.outputs.version }}"
          today=$(date -u +%Y-%m-%d)

          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -n "$latest_tag" ] && git merge-base --is-ancestor "$latest_tag" HEAD 2>/dev/null; then
            notes=$(git log "${latest_tag}..HEAD" --no-merges --pretty=format:"* %s (%h)" | grep -v '^. chore(release):' || true)
          else
            notes=$(git log -1 --pretty=format:"* %s (%h)")
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${{ github.event.client_payload.ref }}" ]; then
            notes="* Rebuild combined image with TorrentDrive/frontend ${{ github.event.client_payload.ref }}"
          fi
          [ -z "$notes" ] && notes="* Maintenance release (${GITHUB_SHA:0:7})"

          sed -i "s|<Version>[^<]*</Version>|<Version>${version}</Version>|" Directory.Build.props

          {
            echo "# Changelog"
            echo ""
            echo "## [${version}] - ${today}"
            echo ""
            echo "${notes}"
            echo ""
            if [ -f CHANGELOG.md ]; then
              tr -d '\r' < CHANGELOG.md | sed '1{/^# Changelog/d;}' | sed '/./,$!d'
            fi
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          printf '%s\n' "$notes" > /tmp/release-notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Directory.Build.props CHANGELOG.md
          git commit -m "chore(release): v${version} [skip ci]"
          git pull --rebase origin main
          release_sha=$(git rev-parse HEAD)
          git push origin HEAD:main

          git tag -f "v${version}" "$release_sha"
          git push -f origin "v${version}"

          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

          if ! gh release create "v${version}" config-schema.json \
            --target "$release_sha" \
            --title "v${version}" \
            --notes-file /tmp/release-notes.md; then
            gh release upload "v${version}" config-schema.json --clobber
          fi

      - name: Notify the deploy webhook, if configured
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "No DEPLOY_WEBHOOK_URL secret set - nothing to notify."
            exit 0
          fi

          status=$(curl -sS -L -o /tmp/deploy.log -w '%{http_code}' -X POST "${DEPLOY_WEBHOOK_URL}" || echo 000)
          echo "Webhook responded ${status}"
          cat /tmp/deploy.log 2>/dev/null || true

          case "${status}" in
            2*) echo "Deploy triggered." ;;
            *)  echo "::warning::Deploy webhook returned ${status}. The images and release published successfully; only the redeploy notification failed." ;;
          esac

      - name: Dispatch downstream builds (website)
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DEPLOY_PAT secret is not configured; skipping cross-repo repository_dispatch."
            exit 0
          fi

          version="${{ needs.compile.outputs.version }}"
          sha="${{ steps.publish.outputs.release_sha }}"

          if gh api repos/TorrentDrive/website/dispatches \
            --method POST \
            -f event_type="config-schema" \
            -f "client_payload[tag]=v${version}" \
            -f "client_payload[sha]=${sha}"; then
            echo "Dispatched config-schema to TorrentDrive/website for v${version}."
          else
            echo "::warning::Failed to dispatch config-schema to TorrentDrive/website. Check DEPLOY_PAT permissions."
          fi
