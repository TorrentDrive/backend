name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    # Fires only for a tag pushed by a human. Release Please tags with
    # GITHUB_TOKEN, and GitHub does not start runs from that token's events —
    # see the tag-release job for how automated releases get their semver tags.
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Compile before building any image. Previously the only compilation happened
  # inside the Docker build stages, so a break was reported four times over as
  # four failed image builds instead of once, with the compiler output buried.
  # There is no test project yet; when one lands, it runs here.
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore TorrentDrive.sln

      - name: Build
        run: dotnet build TorrentDrive.sln -c Release --no-restore

      # Generated from the annotated option types rather than written by hand.
      # Running it on every build means a change to the configuration surface
      # cannot pass CI while silently failing to generate.
      - name: Export the configuration schema
        run: |
          set -euo pipefail
          dotnet TorrentDrive.API/bin/Release/net9.0/TorrentDrive.API.dll --dump-config-schema > config-schema.json
          entries=$(jq '.entries | length' config-schema.json)
          echo "Documented ${entries} configuration values."
          jq -e '.entries | length > 0' config-schema.json > /dev/null

      - name: Upload the configuration schema
        uses: actions/upload-artifact@v4
        with:
          name: config-schema
          path: config-schema.json
          if-no-files-found: error

  images:
    name: ${{ matrix.service.name }}
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: .
            dockerfile: TorrentDrive.API/Dockerfile
          - name: worker
            context: .
            dockerfile: TorrentDrive.Worker/Dockerfile
          - name: gdrive-worker
            context: .
            dockerfile: TorrentDrive.GoogleDrive.Worker/Dockerfile
          # s3-worker was missing from this matrix, so its image was never
          # published even though TorrentDrive.S3.Worker/Dockerfile has always
          # existed. Any deployment splitting the workers into separate
          # services had no image to pull.
          - name: s3-worker
            context: .
            dockerfile: TorrentDrive.S3.Worker/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Needed for the arm64 runtime stage. The SDK stage is pinned to
      # $BUILDPLATFORM in every Dockerfile, so .NET itself never compiles under
      # emulation — only the handful of apt/useradd steps in the runtime stage do.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          # type=semver only emits on a tag, and only fires for a tag pushed by a
          # human: GitHub does not start workflow runs from events raised by
          # GITHUB_TOKEN, which is what Release Please tags with. The tag-release
          # job below is what actually applies semver tags to an automated
          # release; these rules cover the manual case.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TorrentDrive ${{ matrix.service.name }}
            org.opencontainers.image.description=TorrentDrive ${{ matrix.service.name }} — self-hosted torrent-to-cloud
            org.opencontainers.image.vendor=TorrentDrive
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://tc.gitnasr.com
            org.opencontainers.image.documentation=https://tc.gitnasr.com/docs

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          platforms: linux/amd64,linux/arm64

  # Optional, and provider-agnostic.
  #
  # This used to POST to a hardcoded Dokploy webhook and fail the whole workflow
  # when the secret was missing or the response was not exactly 200. It had been
  # failing every push to main with "Branch Not Match" (301) — a Dokploy-side
  # configuration mismatch that made a perfectly good build look broken.
  #
  # TorrentDrive is not tied to one host. It publishes images; Dokploy, Coolify,
  # Railway, Render or a plain docker host all pull them, and most of those
  # redeploy on their own. So this is now a hook for whoever wants one, named
  # after nothing in particular.
  #
  # It never fails the workflow. By the time it runs the images are already
  # published and the build genuinely succeeded — a webhook that is misconfigured
  # or briefly down is not a reason to mark that build red, and re-running the
  # build would not fix it either.
  notify-deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify the deploy webhook, if one is configured
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -uo pipefail

          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "No DEPLOY_WEBHOOK_URL secret set - nothing to notify."
            echo "Images are published; most platforms redeploy by pulling them."
            exit 0
          fi

          status=$(curl -sS -L -o /tmp/deploy.log -w '%{http_code}'             -X POST "${DEPLOY_WEBHOOK_URL}" || echo 000)
          echo "Webhook responded ${status}"
          cat /tmp/deploy.log 2>/dev/null || true

          case "${status}" in
            2*) echo "Deploy triggered." ;;
            *)  echo "::warning::Deploy webhook returned ${status}. The images published successfully; only the redeploy notification failed. Check the webhook URL and, if the host filters by branch, that it accepts main." ;;
          esac

  # Was its own workflow on the same push trigger, so it raced this one: the
  # combined image could be built from a commit whose own images had just failed
  # to build. Gated on images now, so the all-in-one is only rebuilt from a
  # commit that actually compiles.
  dispatch-combined:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger combined image build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          repository: TorrentDrive/deploy
          event-type: build-combined
          client-payload: |
            {
              "repository": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}"
            }

  # Applies the semver tags to a release build.
  #
  # The tag trigger above cannot do this on its own. Release Please creates its
  # tag with GITHUB_TOKEN, and GitHub deliberately does not start workflow runs
  # from events raised by that token, so `on: push: tags` never fires for an
  # automated release. (It does fire for a tag pushed by a human, which is why
  # the trigger stays.)
  #
  # Instead this runs in the same workflow as the build it is tagging: a release
  # commit is a push to main like any other, so the images already exist by the
  # time this job starts. It re-tags them by digest with `imagetools create` —
  # no rebuild, and the semver tag points at exactly the artifact that was
  # tested.
  tag-release:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Is this a release commit?
        id: release
        run: |
          set -euo pipefail

          # Release Please touches the manifest and nothing else does.
          if git diff --name-only HEAD^ HEAD | grep -qx '.release-please-manifest.json'; then
            version=$(jq -r '.["."]' .release-please-manifest.json)
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
            echo "Release commit for ${version}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit; nothing to tag."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags first. This used to run after the schema upload, and when that
      # upload failed with a 403 the semver tags were skipped entirely — so
      # v2.0.0 released with no :2.0.0 images. An optional documentation asset
      # must not be able to block the images.
      - name: Apply semver tags
        if: steps.release.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          major_minor="${{ steps.release.outputs.major_minor }}"
          prefix=$(echo "${{ env.IMAGE_PREFIX }}" | tr "[:upper:]" "[:lower:]")
          for service in api worker gdrive-worker s3-worker; do
            # IMAGE_PREFIX is github.repository, which preserves the owner's
            # casing, and Docker rejects an uppercase repository name.
            image="${{ env.REGISTRY }}/${prefix}/${service}"
            source_tag="sha-${{ github.sha }}"
            echo "Tagging ${image} as ${version} and ${major_minor}"
            docker buildx imagetools create               --tag "${image}:${version}"               --tag "${image}:${major_minor}"               "${image}:${source_tag}"
          done

      - uses: actions/setup-dotnet@v4
        if: steps.release.outputs.is_release == 'true'
        with:
          dotnet-version: "9.0.x"

      # Best effort, and deliberately after the tags. The docs site falls back
      # to the previous release's schema if this is missing, which is a much
      # smaller problem than a release with no versioned images.
      - name: Attach the configuration schema to the release
        if: steps.release.outputs.is_release == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet build TorrentDrive.sln -c Release
          dotnet TorrentDrive.API/bin/Release/net9.0/TorrentDrive.API.dll --dump-config-schema > config-schema.json
          gh release upload "v${{ steps.release.outputs.version }}" config-schema.json --clobber
