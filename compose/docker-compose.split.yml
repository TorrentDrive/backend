# TorrentDrive — split services.
#
# Runs the web app, API and three workers as separate containers against
# PostgreSQL and Redis you provide. Use this when you want managed data stores,
# or want to scale a worker independently.
#
#   docker compose -f compose/docker-compose.split.yml up -d
#
# The all-in-one image is simpler and is what the installer uses. Reach for this
# one only if you have a reason.
#
# Unlike the all-in-one, this topology does NOT generate its own secrets — there
# is no single init step to do it. POSTGRES_PASSWORD and JWT_SECRET are required
# and the stack refuses to start without them:
#
#   POSTGRES_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
#   JWT_SECRET=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 48)

x-backend-env: &backend-env
  ConnectionStrings__DefaultConnection: >-
    Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-torrentdrive};Username=${POSTGRES_USER:-torrentdrive_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  Redis__ConnectionString: ${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
  Jwt__Key: ${JWT_SECRET:?JWT_SECRET is required}
  Jwt__Issuer: ${JWT_ISSUER:-TorrentDrive_API}
  Jwt__Audience: ${JWT_AUDIENCE:-TorrentDrive_Client}
  TORRENT_DOWNLOAD_PATH: /data/downloads
  ASPNETCORE_ENVIRONMENT: Production

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torrentdrive}
      POSTGRES_USER: ${POSTGRES_USER:-torrentdrive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torrentdrive_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["bundled-db"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["bundled-db"]

  api:
    image: ghcr.io/torrentdrive/backend/api:${TORRENTDRIVE_BACKEND_VERSION:-${TORRENTDRIVE_VERSION:-latest}}
    restart: unless-stopped
    environment:
      <<: *backend-env
      APPLY_MIGRATIONS: "true"
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:47100}
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - downloads:/data/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  web:
    image: ghcr.io/torrentdrive/frontend/web:${TORRENTDRIVE_FRONTEND_VERSION:-${TORRENTDRIVE_VERSION:-latest}}
    restart: unless-stopped
    environment:
      # Resolved per request by the frontend's proxy route, so one image works
      # against any backend. Not baked at build time.
      BACKEND_URL: http://api:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${PUBLIC_URL:-http://localhost:47100}
    ports:
      - "${FRONTEND_PORT:-47100}:3000"
    depends_on:
      api:
        condition: service_healthy

  torrent-worker:
    image: ghcr.io/torrentdrive/backend/worker:${TORRENTDRIVE_BACKEND_VERSION:-${TORRENTDRIVE_VERSION:-latest}}
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - downloads:/data/downloads
    depends_on:
      api:
        condition: service_healthy

  gdrive-worker:
    image: ghcr.io/torrentdrive/backend/gdrive-worker:${TORRENTDRIVE_BACKEND_VERSION:-${TORRENTDRIVE_VERSION:-latest}}
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - downloads:/data/downloads
    depends_on:
      api:
        condition: service_healthy

  s3-worker:
    image: ghcr.io/torrentdrive/backend/s3-worker:${TORRENTDRIVE_BACKEND_VERSION:-${TORRENTDRIVE_VERSION:-latest}}
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - downloads:/data/downloads
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  # Shared by the API and all three workers: the torrent worker writes files
  # here and the upload workers read them back.
  downloads:
